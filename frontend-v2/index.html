<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Congressional Activity Dashboard</title>
    
    <!-- Google Fonts - Editorial Typography Stack -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- DOMPurify for XSS sanitization + Marked.js for Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="js/utils/sanitize.js"></script>
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/spotlight-redesign.css">
    <link rel="stylesheet" href="css/how-bills-work.css">
</head>
<body>
    <!-- Header / Main Navigation -->
    <header class="main-header">
        <div class="header-container">
            <div class="logo">
                <a href="#" id="logo-link">Legal Ease</a>
            </div>

            <div class="user-profile">
                <button id="profile-btn" class="profile-btn">
                    <span class="profile-icon">👤</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Error/Success Notifications -->
        <div id="error-log" class="notification-container" style="display: none;"></div>

        <!-- Onboarding Modal Container (populated by ModalComponent) -->
        <div id="onboarding-modal-container"></div>

        <!-- Dashboard Layout -->
        <div class="dashboard-layout">
            <!-- Left Column - Learn + Calendar -->
            <section class="dashboard-left">
                <!-- Learn - Educational content (Phase 2 placeholder) -->
                <div class="sidebar-module sidebar-module--learn">
                    <h3 class="module-title">Learn</h3>
                    <div class="learn-items">
                        <a href="#" class="learn-item learn-item--coming-soon">
                            <span class="learn-icon">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                                </svg>
                            </span>
                            <span class="learn-content">
                                <span class="learn-title">The Gauntlet</span>
                                <span class="learn-desc">Can your bill survive Congress?</span>
                            </span>
                            <span class="coming-soon-badge">Coming Soon</span>
                        </a>
                        <a href="#" class="learn-item" data-learn="how-bills-work">
                            <span class="learn-icon">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                    <polyline points="14 2 14 8 20 8"></polyline>
                                </svg>
                            </span>
                            <span class="learn-content">
                                <span class="learn-title">How Bills Work</span>
                                <span class="learn-desc">The legislative process explained</span>
                            </span>
                        </a>
                        <a href="#" class="learn-item learn-item--coming-soon">
                            <span class="learn-icon">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <circle cx="12" cy="12" r="10"></circle>
                                    <path d="M12 16v-4M12 8h.01"></path>
                                </svg>
                            </span>
                            <span class="learn-content">
                                <span class="learn-title">Committee Power</span>
                                <span class="learn-desc">Who controls what gets heard</span>
                            </span>
                            <span class="coming-soon-badge">Coming Soon</span>
                        </a>
                    </div>
                </div>

                <!-- Upcoming Meetings - What's on the calendar -->
                <div class="sidebar-module">
                    <h3 class="module-title">
                        <span>This Week</span>
                    </h3>
                    <div id="upcoming-meetings" class="upcoming-meetings-section">
                        <!-- UpcomingMeetings component renders here -->
                    </div>
                </div>
            </section>

            <!-- Center Column - Bill Detail Panel -->
            <section class="dashboard-center">
                <div id="bill-detail-section" class="bill-detail-section">
                    <!-- BillDetailPanel component renders here -->
                </div>
            </section>

            <!-- Right Column - Tracking + My Reps + All Bills -->
            <aside class="dashboard-sidebar">
                <!-- Tracking - Bills you're following -->
                <div class="sidebar-module">
                    <h3 class="module-title">
                        <span>Tracking</span>
                        <span class="module-count" id="following-count"></span>
                    </h3>
                    <div id="following-sidebar" class="following-container">
                        <!-- Followed bills will be inserted here -->
                    </div>
                </div>

                <!-- Your Representatives - Activity List -->
                <div id="rep-activity-section" class="rep-activity-section">
                    <!-- RepActivityPanel component renders here -->
                </div>

                <!-- All Bills - Browse all congressional bills -->
                <div class="sidebar-module">
                    <h3 class="module-title">
                        <span>All Bills</span>
                    </h3>
                    <div id="all-bills-panel" class="all-bills-container">
                        <!-- AllBillsPanel component renders here -->
                    </div>
                </div>
            </aside>
        </div>
    </main>

    <!-- JavaScript -->
    <!-- Utilities and Foundation -->
    <script src="js/utils/events.js"></script>
    <script src="js/utils/dom.js"></script>
    <script src="js/utils/formatting.js"></script>
    <script src="js/utils/bill-journey.js"></script>
    <script src="js/utils/legislative-simulator.js"></script>
    <script src="js/utils/stage-content.js"></script>
    <script src="js/utils/cr-link-parser.js"></script>

    <!-- Services -->
    <script src="js/services/location-service.js"></script>
    
    <!-- Core Services -->
    <script src="js/state.js"></script>
    <script src="js/error-handler.js"></script>
    <script src="js/api-service.js"></script>
    <script src="js/chat-api-service.js"></script>
    <script src="js/congressional-data-service.js"></script>
    
    <!-- Component System -->
    <script src="js/components/base-component.js"></script>
    <script src="js/components/loading.js"></script>
    <script src="js/components/error.js"></script>
    <script src="js/components/modal.js"></script>
    <script src="js/components/card.js"></script>
    <script src="js/components/bill-detail-view.js"></script>
    <script src="js/components/bill-header.js"></script>
    <script src="js/components/status-tracker.js"></script>
    <script src="js/components/tabbed-container.js"></script>
    <script src="js/components/bill-summary-card.js"></script>
    <script src="js/components/spotlight-section.js"></script>
    <script src="js/components/spotlight-section-redesign.js"></script>
    <script src="js/components/todays-spotlight.js"></script>
    <script src="js/components/upcoming-meetings.js"></script>
    <script src="js/components/your-congress.js"></script>
    <script src="js/components/rep-activity-panel.js"></script>
    <script src="js/components/cr-page-viewer.js"></script>
    <script src="js/components/bill-detail-panel.js"></script>
    <script src="js/components/bill-detail-modal.js"></script>
    <script src="js/components/all-bills-panel.js"></script>
    <script src="js/components/how-bills-work-modal.js"></script>

    <!-- Pages -->
    <script src="js/pages/dashboard.js"></script>
    
    <!-- App Initialization -->
    <script>
        // Global Error Handling
        window.addEventListener('error', function(event) {
            console.error('Unhandled global error:', event.message, event.filename, event.lineno, event.colno, event.error);
            // Optionally, display a user-friendly message
            const errorLog = document.getElementById('error-log');
            if (errorLog) {
                errorLog.textContent = 'A critical error occurred. Please refresh the page.';
                errorLog.style.display = 'block';
            }
        });

        window.addEventListener('unhandledrejection', function(event) {
            console.warn('Unhandled promise rejection:', event.reason);
            const errorLog = document.getElementById('error-log');
            if (errorLog) {
                errorLog.textContent = 'An unexpected error occurred. Please try again later.';
                errorLog.style.display = 'block';
            }
        });

        // Ensure body scroll is enabled on page load
        document.body.style.overflow = '';
        document.body.removeAttribute('data-modal-open');
        
        // Add emergency scroll restore function (accessible via browser console)
        window.restoreScroll = function() {
            console.warn('Scroll restoration manually triggered.');
            document.body.style.overflow = '';
            document.body.removeAttribute('data-modal-open');
        };
        
        // Initialize dashboard when DOM is ready
        document.addEventListener('DOMContentLoaded', async () => {
            if (typeof dashboard === 'undefined') {
                console.error('[App] Critical: dashboard object not found. App cannot start.');
                // Display a critical error message to the user
                const errorLog = document.getElementById('error-log');
                if (errorLog) {
                    errorLog.textContent = 'Application failed to load. Please contact support.';
                    errorLog.style.display = 'block';
                }
                return;
            }

            try {
                await dashboard.init();
            } catch (error) {
                console.error('[App] Failed to initialize dashboard:', error);
                // Ensure scroll is restored even if there's an error
                document.body.style.overflow = '';
                document.body.removeAttribute('data-modal-open');
            }
        });
    </script>
</body>
</html>
